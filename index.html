<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>MYouPiP - Clean HTML5 & HLS Video Player</title>
  
  <!-- Thư viện Plyr & Hls.js chuẩn tương tự LiveReacting -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* Khung player chuẩn tỷ lệ 16:9, căn giữa toàn màn hình */
    .player-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: calc(100vw * 9 / 16);
      max-height: 100vh;
      max-width: calc(100vh * 16 / 9);
      aspect-ratio: 16 / 9;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Ép Plyr vừa khít 100% khung 16:9 */
    .player-wrapper .plyr,
    .player-wrapper video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    /* Thanh nhập link nổi trên cùng, tự động ẩn khi không di chuột */
    .floating-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Hiện thanh bar khi di chuột hoặc focus */
    body.show-controls .floating-bar,
    .floating-bar:hover,
    .floating-bar:focus-within {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .floating-bar input[type="text"] {
      width: 380px;
      max-width: 55vw;
      padding: 8px 16px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .floating-bar input[type="text"]:focus {
      background: rgba(255, 255, 255, 0.18);
      border-color: #00b3ff;
    }

    .floating-bar input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .floating-bar button {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      background-color: #00b3ff;
      color: #000;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, transform 0.1s;
    }

    .floating-bar button:hover {
      background-color: #33c6ff;
    }

    .floating-bar button:active {
      transform: scale(0.96);
    }

    /* Màn hình trống ban đầu khi chưa dán link */
    .empty-state {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      z-index: 5;
      text-align: center;
      padding: 20px;
      transition: opacity 0.3s ease;
    }

    .empty-state.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      fill: #00b3ff;
      opacity: 0.9;
    }

    .empty-state h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 0.9rem;
      color: #888;
      max-width: 480px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .empty-state .quick-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .empty-state .quick-btn {
      padding: 6px 14px;
      font-size: 12px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      color: #ccc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .empty-state .quick-btn:hover {
      background: #2a2a2a;
      color: #fff;
      border-color: #00b3ff;
    }

    /* Tùy chỉnh màu chủ đạo của Plyr */
    :root {
      --plyr-color-main: #00b3ff;
    }
  </style>
</head>
<body>

  <!-- Thanh nhập URL luồng stream ẩn hiện thông minh -->
  <form class="floating-bar" id="streamForm">
    <input 
      type="text" 
      id="streamUrlInput" 
      placeholder="Dán link googlevideo, .m3u8 hoặc .mp4..." 
      autocomplete="off"
    />
    <button type="submit">Phát Stream</button>
  </form>

  <!-- Khung phát video chuẩn 16:9 không viền, không logo YouTube -->
  <div class="player-wrapper">
    <video id="videoPlayer" playsinline></video>

    <!-- Màn hình chào khi chưa có link -->
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <h2>MYouPiP - Trình phát HLS & Stream sạch 100%</h2>
      <p>Hỗ trợ phát luồng trực tiếp từ Google Video, HLS (.m3u8), MP4. Hoàn toàn không logo, không tiêu đề rườm rà.</p>
      <div class="quick-links">
        <button class="quick-btn" id="sampleHlsBtn">Thử HLS Live mẫu</button>
        <button class="quick-btn" id="sampleMp4Btn">Thử Big Buck Bunny MP4</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const form = document.getElementById('streamForm');
    const input = document.getElementById('streamUrlInput');
    const emptyState = document.getElementById('emptyState');

    let hlsInstance = null;

    // Khởi tạo trình phát Plyr chuyên nghiệp giống hệt LiveReacting
    const player = new Plyr(video, {
      controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'duration',
        'mute',
        'volume',
        'pip',        // Nút Picture-in-Picture tiện lợi
        'fullscreen'
      ],
      ratio: '16:9',
      autoplay: true,
      keyboard: { focused: true, global: true },
      tooltips: { controls: true, seek: true }
    });

    // Tự động ẩn thanh điều khiển sau 2.5s không di chuột
    let hideTimer;
    function showControlsBriefly() {
      document.body.classList.add('show-controls');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (document.activeElement !== input) {
          document.body.classList.remove('show-controls');
        }
      }, 2500);
    }

    window.addEventListener('mousemove', showControlsBriefly);
    window.addEventListener('touchstart', showControlsBriefly);

    // Hàm nạp luồng stream video (hỗ trợ cả HLS .m3u8 và link trực tiếp googlevideo / mp4)
    function playStream(url) {
      if (!url) return;
      url = url.trim();

      emptyState.classList.add('hidden');
      input.value = url;

      // Hủy Hls instance cũ nếu có
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      // Kiểm tra nếu là luồng HLS (.m3u8)
      if (url.includes('.m3u8') && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          player.play();
        });
      } else {
        // Link video trực tiếp (Google Video, MP4, WebM, ...)
        video.src = url;
        player.play().catch(() => {});
      }

      // Cập nhật URL trình duyệt (dùng hash để không reload trang)
      window.history.replaceState({}, '', '#' + encodeURIComponent(url));
    }

    // Bắt sự kiện submit form dán URL
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (url) {
        playStream(url);
        input.blur();
        document.body.classList.remove('show-controls');
      }
    });

    // Lấy link từ URL của trình duyệt khi mở trang (?src=... hoặc #link)
    function getStreamUrlFromLocation() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('src')) return decodeURIComponent(params.get('src'));
      if (params.has('url')) return decodeURIComponent(params.get('url'));

      if (window.location.hash) {
        const hash = window.location.hash.substring(1);
        if (hash.startsWith('http')) return decodeURIComponent(hash);
      }

      // Kiểm tra đường dẫn pathname nếu có dạng /http...
      const path = window.location.pathname.substring(1);
      if (path.startsWith('http')) return decodeURIComponent(path);

      return null;
    }

    // Nút thử stream mẫu
    document.getElementById('sampleHlsBtn').addEventListener('click', () => {
      playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
    });

    document.getElementById('sampleMp4Btn').addEventListener('click', () => {
      playStream('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4');
    });

    // Khởi động khi tải trang
    window.addEventListener('DOMContentLoaded', () => {
      const initialUrl = getStreamUrlFromLocation();
      if (initialUrl) {
        playStream(initialUrl);
      } else {
        showControlsBriefly();
      }
    });

    // Lắng nghe thay đổi hash
    window.addEventListener('hashchange', () => {
      const url = getStreamUrlFromLocation();
      if (url) playStream(url);
    });
  </script>
</body>
</html>
