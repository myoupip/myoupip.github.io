<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MYouPiP - Clean HTML5 & HLS Video Player</title>
  <!-- Thư viện Plyr & Hls.js chuẩn tương tự LiveReacting -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- YouTube IFrame Player API để đồng bộ điều khiển và lấy callback -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Thanh nhập URL luồng stream ẩn hiện thông minh -->
  <form class="floating-bar" id="streamForm">
    <input 
      type="text" 
      id="streamUrlInput" 
      placeholder="Dán link googlevideo, .m3u8 hoặc .mp4..." 
      autocomplete="off"
    />
    <button type="submit">Phát Stream</button>
  </form>

  <!-- Khung phát video chuẩn 16:9 không viền, không logo YouTube -->
  <div class="player-wrapper">
    <div id="youtubePlayer" style="display: none;"></div>
    <video id="videoPlayer" playsinline referrerpolicy="no-referrer"></video>

    <!-- Màn hình chào khi chưa có link -->
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <h2>MYouPiP - Trình phát HLS & Stream sạch 100%</h2>
      <p>Hỗ trợ phát luồng trực tiếp từ Google Video, HLS (.m3u8), MP4. Hoàn toàn không logo, không tiêu đề rườm rà.</p>
      <div class="quick-links">
        <button class="quick-btn" id="sampleHlsBtn">Thử HLS Live mẫu</button>
        <button class="quick-btn" id="sampleMp4Btn">Thử Big Buck Bunny MP4</button>
      </div>
    </div>
  </div>

  <!-- Thư viện jQuery -->
  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
  <!-- Logic phát video và cầu nối giao tiếp App WebView (đã tách module) -->
  <script src="js/state.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/youtube-player.js"></script>
  <script src="js/stream-player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
